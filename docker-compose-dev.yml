services:
  api: 
      build: .
      depends_on:
        - postgres
      ports:
        - 8000:8000
      volumes:
        - ./:/usr/src/app:ro
      environment:
        - DATABASE_HOSTNAME=postgres
        - DATABASE_PORT=5432
        - DATABASE_PASSWORD=postgres15AA
        - DATABASE_NAME=fastapi
        - DATABASE_USERNAME=postgres
        - SECRET_KEY=5678c7b43a64b44f5ae12d783792cb6389bb7a2b36806cb7c3473cf992c982f7
        - ALGORITHM=HS256
        - ACCESS_TOKEN_EXPIRE_MINUTES=30
      command: >
        sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"


  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=postgres15AA
      - POSTGRES_DB=fastapi
    
    volumes:
      - postgres-db:/var/lib/postgresql

volumes:
  postgres-db: